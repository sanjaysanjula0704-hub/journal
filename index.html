<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chaandhu's Journal 🌙</title>
  <meta name="description" content="Chaandhu's personal daily journal — track habits, meals, exercise, and daily routines in a beautiful, motivating app." />
  <meta name="theme-color" content="#7C3AED" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- Pages -->
    <div id="page-today" class="page active"></div>
    <div id="page-exercise" class="page"></div>
    <div id="page-food" class="page"></div>
    <div id="page-journal" class="page"></div>
    <div id="page-history" class="page"></div>
    <!-- Modals / Sub-pages -->
    <div id="modal-water" class="modal-overlay hidden"></div>
    <div id="modal-learn" class="modal-overlay hidden"></div>
    <div id="modal-history" class="modal-overlay hidden"></div>
    <div id="modal-weekly" class="modal-overlay hidden"></div>
    <!-- Celebration Overlay -->
    <div id="celebration" class="celebration-overlay hidden"></div>
    <!-- Bottom Nav -->
    <nav id="bottom-nav">
      <button class="nav-btn active" data-page="today" id="nav-today">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">Today</span>
      </button>
      <button class="nav-btn" data-page="exercise" id="nav-exercise">
        <span class="nav-icon">🏋️</span>
        <span class="nav-label">Exercise</span>
      </button>
      <button class="nav-btn" data-page="food" id="nav-food">
        <span class="nav-icon">🐱</span>
        <span class="nav-label">July's Food</span>
      </button>
      <button class="nav-btn" data-page="journal" id="nav-journal">
        <span class="nav-icon">📖</span>
        <span class="nav-label">Journal</span>
      </button>
      <button class="nav-btn" data-page="history" id="nav-history">
        <span class="nav-icon">📅</span>
        <span class="nav-label">History</span>
      </button>
    </nav>
  </div>
  <script src="app.js"></script>
</body>
</html>
